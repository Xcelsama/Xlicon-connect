<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XLICON-MD session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4; --ink: #14202b; --muted: #55646f; --line: #c9d2d9;
    --panel: #ffffff; --accent: #0b6e6e; --accent-ink: #ffffff; --warn: #8a4b00; --err: #a3262a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181e; --ink: #e6edf2; --muted: #93a3af; --line: #2c3842;
      --panel: #1a232b; --accent: #4fc3c3; --accent-ink: #08201f; --warn: #e0a95c; --err: #ff8a8d;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 460px; margin: 0 auto; padding: 40px 20px 56px; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 28px; }

  .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
  .tabs button {
    flex: 1; padding: 12px; background: transparent; color: var(--muted);
    border: 0; font: 500 15px/1 inherit; font-family: inherit; cursor: pointer;
  }
  .tabs button + button { border-left: 1px solid var(--line); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input[type="tel"] {
    width: 100%; padding: 12px; font: 500 18px/1 "IBM Plex Mono", ui-monospace, monospace;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 16px; }

  .btn {
    display: inline-block; padding: 13px 20px; border-radius: 8px; border: 0; cursor: pointer;
    font: 600 16px/1 "IBM Plex Sans", system-ui, sans-serif; background: var(--accent); color: var(--accent-ink);
  }
  .btn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #out { margin-top: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .qr { display: block; width: 100%; max-width: 320px; margin: 0 auto; image-rendering: pixelated; border-radius: 4px; }
  .code {
    font: 600 clamp(34px, 11vw, 48px)/1.1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: .06em; text-align: center; margin: 4px 0 14px;
  }
  .steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
  .steps li + li { margin-top: 4px; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .err { color: var(--err); font-weight: 500; }
  .sid {
    width: 100%; height: 120px; resize: none; padding: 12px; margin: 10px 0 12px;
    font: 500 13px/1.4 "IBM Plex Mono", ui-monospace, monospace;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; word-break: break-all;
  }
  .warn { color: var(--warn); font-size: 14px; margin: 14px 0 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Get your session ID</h1>
  <p class="lead">Link a WhatsApp number to XLICON-MD. Use a spare number, not your main one.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-qr" aria-selected="true">Scan QR</button>
    <button role="tab" id="tab-pair" aria-selected="false">Pairing code</button>
  </div>

  <div id="pair-field" hidden>
    <label for="number">WhatsApp number</label>
    <input id="number" type="tel" inputmode="numeric" autocomplete="tel" placeholder="2348012345678">
    <p class="hint">Country code first, digits only. No + or spaces.</p>
  </div>

  <button class="btn" id="go">Show QR code</button>

  <section id="out" aria-live="polite"></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let mode = 'qr', id = null, timer = null;

function setMode(m) {
  mode = m;
  $('#tab-qr').setAttribute('aria-selected', m === 'qr');
  $('#tab-pair').setAttribute('aria-selected', m === 'pair');
  $('#pair-field').hidden = m !== 'pair';
  $('#go').textContent = m === 'qr' ? 'Show QR code' : 'Get pairing code';
  reset();
}
$('#tab-qr').onclick = () => setMode('qr');
$('#tab-pair').onclick = () => setMode('pair');

function reset() {
  clearInterval(timer);
  if (id) fetch('/api/session/' + id, { method: 'DELETE' }).catch(() => {});
  id = null;
  $('#out').innerHTML = '';
  $('#go').disabled = false;
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function show(html) { $('#out').innerHTML = html; }

$('#go').onclick = async () => {
  reset();
  $('#go').disabled = true;
  show('<div class="status"><span class="dot"></span>Starting…</div>');
  try {
    const res = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, number: $('#number').value }),
    });
    const data = await res.json();
    if (!res.ok) { show('<p class="err">' + esc(data.error || 'Something went wrong.') + '</p>'); $('#go').disabled = false; return; }
    id = data.id;
    timer = setInterval(poll, 2000);
    poll();
  } catch {
    show('<p class="err">Could not reach the server.</p>');
    $('#go').disabled = false;
  }
};

async function poll() {
  if (!id) return;
  let s;
  try { s = await (await fetch('/api/status/' + id)).json(); } catch { return; }

  if (s.state === 'qr') {
    show('<div class="panel"><img class="qr" alt="WhatsApp QR code" src="' + s.qr + '">' +
      '<ol class="steps"><li>Open WhatsApp on the phone</li><li>Settings, then Linked devices</li><li>Link a device, then scan this code</li></ol></div>');
  } else if (s.state === 'code') {
    show('<div class="panel"><div class="code">' + esc(s.code) + '</div>' +
      '<ol class="steps"><li>Open WhatsApp on the phone</li><li>Settings, then Linked devices</li>' +
      '<li>Link a device, then “Link with phone number instead”</li><li>Type the code above</li></ol></div>');
  } else if (s.state === 'linking') {
    show('<div class="status"><span class="dot"></span>Linked. Finishing up…</div>');
  } else if (s.state === 'done') {
    clearInterval(timer);
    show('<div class="panel"><strong>Your session ID</strong>' +
      '<textarea class="sid" id="sid" readonly></textarea>' +
      '<div class="row"><button class="btn" id="copy">Copy</button><button class="btn quiet" id="again">Start over</button></div>' +
      '<p class="warn">This is a password for that WhatsApp account. Paste it into your bot’s <code>SESSION_ID</code> and share it with no one. Do not run the bot in two places at once.</p></div>');
    $('#sid').value = s.sessionId;
    $('#copy').onclick = async () => {
      try { await navigator.clipboard.writeText(s.sessionId); }
      catch { $('#sid').select(); document.execCommand('copy'); }
      $('#copy').textContent = 'Copied';
    };
    $('#again').onclick = () => { id = null; reset(); };
  } else if (s.state === 'error' || s.state === 'expired') {
    clearInterval(timer);
    show('<p class="err">' + esc(s.error || 'This attempt timed out. Start again.') + '</p>');
    $('#go').disabled = false;
  } else {
    show('<div class="status"><span class="dot"></span>Connecting to WhatsApp…</div>');
  }
}
</script>
</body>
</html>
